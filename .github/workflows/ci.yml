name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  native-macos:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Check formatting
        run: swift format lint -r Package.swift Sources Tests
      - name: Test
        run: swift test
      - name: Build Apple Silicon app executable
        run: swift build -c release --arch arm64 --product EPUBZipApp
      - name: Verify architecture
        run: |
          bin_dir=$(swift build -c release --arch arm64 --show-bin-path)
          file "$bin_dir/EPUBZipApp" | grep arm64
